name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: make install lint test build
      - run: make test-pg
      - name: Runtime image builds
        run: docker compose build
      - name: End-to-end tests
        run: make e2e
      - name: E2E traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-results
          path: e2e/.work/results
