# End-to-end stack: the runtime image with fake judge and improver, seeded session folders and a
# Playwright runner. Use through `make e2e` (e2e/run.sh); it creates e2e/.work first, as your user.
name: introspect-pw
# The one fixed instant of the run: the app clock starts here (it then advances in real time), the
# seed generator and the browser clock use it too.
x-now: &now '2026-11-09T12:00:00Z'
services:
  app:
    image: introspect-pw:app
    build:
      context: .
      target: runtime
    user: '${UID:-1000}:${GID:-1000}'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    environment:
      CHOKIDAR_USEPOLLING: '1'
      INTROSPECT_JUDGE: fake
      INTROSPECT_IMPROVER: fake
      INTROSPECT_NOW: *now
      # Session intake (spec 7): the Playwright container shares this network namespace.
      INTROSPECT_INTAKE_PORT: '7318'
      # The port is not published on the host, so the doctor must not warn that other machines reach it.
      INTROSPECT_INTAKE_BIND: 127.0.0.1
      # S3 source (spec 7): MinIO below; the credentials are the MinIO root user.
      AWS_ACCESS_KEY_ID: &s3key e2eaccess
      AWS_SECRET_ACCESS_KEY: &s3secret e2esecret-0123456789
      AWS_REGION: us-east-1
      INTROSPECT_S3_ALLOW_HTTP: '1'
      TZ: UTC
      GIT_AUTHOR_NAME: Introspect E2E
      GIT_AUTHOR_EMAIL: e2e@example.invalid
      GIT_COMMITTER_NAME: Introspect E2E
      GIT_COMMITTER_EMAIL: e2e@example.invalid
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:7317/v1/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))
      interval: 1s
      timeout: 3s
      retries: 60
    volumes:
      # Throwaway: `down -v` deletes it.
      - data:/data
      - type: bind
        source: ./e2e/.work/sources/claude/projects
        target: /sources/claude/projects
        read_only: true
      - type: bind
        source: ./e2e/.work/sources/codex/sessions
        target: /sources/codex/sessions
        read_only: true
      # Empty: the setup wizard creates the repository.
      - type: bind
        source: ./e2e/.work/repos/skills
        target: /repos/skills
      - type: bind
        source: ./e2e/.work/repos/projects
        target: /repos/projects
      # The folder `introspect push` reads (spec 7).
      - type: bind
        source: ./e2e/.work/extra/push
        target: /push
        read_only: true

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: *s3key
      MINIO_ROOT_PASSWORD: *s3secret
    healthcheck:
      test: [CMD, mc, ready, local]
      interval: 1s
      timeout: 3s
      retries: 60

  # Creates the bucket and uploads the fixture sessions, then exits. run.sh starts it after the seed
  # (which writes the fixtures): `dc run --rm minio-init`.
  minio-init:
    image: pgsty/mc:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 $${AWS_ACCESS_KEY_ID} $${AWS_SECRET_ACCESS_KEY}
        mc mb --ignore-existing local/e2e-logs
        mc cp --recursive /fixtures/ local/e2e-logs/
    environment:
      AWS_ACCESS_KEY_ID: *s3key
      AWS_SECRET_ACCESS_KEY: *s3secret
    volumes:
      - ./e2e/.work/extra/s3:/fixtures:ro

  playwright:
    image: introspect-pw:playwright
    build:
      context: ./e2e
    # Shares the app's network: the API only answers to Host 127.0.0.1:7317 (ADR-0008).
    network_mode: 'service:app'
    depends_on:
      app:
        condition: service_healthy
    user: '${UID:-1000}:${GID:-1000}'
    init: true
    ipc: host
    working_dir: /opt/e2e
    environment:
      TZ: UTC
      NPM_CONFIG_UPDATE_NOTIFIER: 'false'
      INTROSPECT_NOW: *now
      GIT_AUTHOR_NAME: Introspect E2E
      GIT_AUTHOR_EMAIL: e2e@example.invalid
      GIT_COMMITTER_NAME: Introspect E2E
      GIT_COMMITTER_EMAIL: e2e@example.invalid
    volumes:
      # The sign-in token, read-only.
      - data:/data:ro
      - ./e2e/.work:/work
      - ./e2e/__screenshots:/opt/e2e/__screenshots
      # Fixture builders of the ingest tests; the seed script reuses them.
      - ./src/platform/testkit/agent-fixtures.ts:/opt/e2e/vendor/agent-fixtures.ts:ro

volumes:
  data:
