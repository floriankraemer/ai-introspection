# User-facing stack: `docker compose up`, then open http://localhost:7317
name: introspect
services:
  introspect:
    image: introspect:local
    build:
      context: .
      target: runtime
    # Run as the host user so files written to bind mounts are never owned by root.
    user: '${UID:-1000}:${GID:-1000}'
    ports:
      - '127.0.0.1:7317:7317'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    restart: unless-stopped
    environment:
      # inotify is unreliable on WSL2 and Docker Desktop bind mounts; the watcher polls.
      CHOKIDAR_USEPOLLING: '1'
      # Pass-through form: a variable you leave out of .env stays unset in the container.
      # An empty GIT_AUTHOR_NAME would make git refuse to commit.
      GIT_AUTHOR_NAME:
      GIT_AUTHOR_EMAIL:
      GIT_COMMITTER_NAME:
      GIT_COMMITTER_EMAIL:
      GH_TOKEN:
    volumes:
      - data:/data
      # Agent logs, read-only. Compose has no optional bind mounts: a missing folder is created
      # empty, so startup never fails. `make up` creates both as your user first, because the
      # Docker engine on Linux would otherwise create them owned by root.
      - type: bind
        source: ${HOME}/.claude/projects
        target: /sources/claude/projects
        read_only: true
      - type: bind
        source: ${HOME}/.codex/sessions
        target: /sources/codex/sessions
        read_only: true
      # Global skills repository and project repositories, read-write: Introspect commits
      # rubrics and merges proposals there. `make up` creates both folders as your user first.
      # The default is a dedicated folder, never ~/.claude: that holds your Claude credentials,
      # hooks and transcripts, and a read-write mount would defeat the read-only /sources mounts.
      # Set INTROSPECT_SKILLS_REPO to your existing skills repository, or leave it and let the
      # setup wizard create a repository in the empty default folder.
      - type: bind
        source: ${INTROSPECT_SKILLS_REPO:-${HOME}/.introspect/skills}
        target: /repos/skills
      - type: bind
        source: ${INTROSPECT_PROJECTS_DIR:-${HOME}/.introspect/projects}
        target: /repos/projects

volumes:
  data:
