# User-facing stack: `docker compose up`, then open http://localhost:7317
name: introspect
services:
  introspect:
    image: introspect:local
    container_name: introspect
    build:
      context: .
      target: runtime
    # Run as the host user so files written to bind mounts are never owned by root.
    user: '${UID:-1000}:${GID:-1000}'
    ports:
      - '127.0.0.1:7317:7317'
      # Intake port where other people push sessions. Set INTROSPECT_INTAKE_BIND=0.0.0.0 in .env to
      # expose it, and put TLS (a reverse proxy) in front.
      - '${INTROSPECT_INTAKE_BIND:-127.0.0.1}:7318:7318'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    init: true
    # Runaway-process and memory ceilings; raise them with INTROSPECT_PIDS_LIMIT / INTROSPECT_MEM_LIMIT.
    pids_limit: ${INTROSPECT_PIDS_LIMIT:-512}
    mem_limit: ${INTROSPECT_MEM_LIMIT:-2g}
    restart: unless-stopped
    environment:
      # inotify is unreliable on WSL2 and Docker Desktop bind mounts; the watcher polls.
      CHOKIDAR_USEPOLLING: '1'
      # Pass-through form: a variable you leave out of .env stays unset in the container.
      # An empty GIT_AUTHOR_NAME would make git refuse to commit.
      GIT_AUTHOR_NAME:
      GIT_AUTHOR_EMAIL:
      GIT_COMMITTER_NAME:
      GIT_COMMITTER_EMAIL:
      # PR accept mode only. Use a fine-grained personal access token limited to the skills and project
      # repositories (Contents and Pull requests: read and write), never a classic token.
      GH_TOKEN:
      # Test-only judge (`fake`); leave it out of .env for real grading.
      INTROSPECT_JUDGE:
      # Test-only improver (`fake`); leave it out of .env for real proposals.
      INTROSPECT_IMPROVER:
      # Time zone of the budget windows ("tokens per day", "dollars per month"); UTC when unset.
      TZ:
      INTROSPECT_INTAKE_PORT: '7318'
      # Only for `introspect doctor`: the address the intake port is published on (see ports).
      INTROSPECT_INTAKE_BIND: ${INTROSPECT_INTAKE_BIND:-127.0.0.1}
      INTROSPECT_INTAKE_MAX_MB: ${INTROSPECT_INTAKE_MAX_MB:-64}
      INTROSPECT_INTAKE_QUOTA_MB: ${INTROSPECT_INTAKE_QUOTA_MB:-2048}
      # AWS credentials for S3 sources (pass-through: unset unless in .env); Introspect never stores them.
      # AWS_PROFILE is not passed: ~/.aws is not mounted, so a profile could not resolve here.
      AWS_ACCESS_KEY_ID:
      AWS_SECRET_ACCESS_KEY:
      AWS_SESSION_TOKEN:
      AWS_REGION:
    volumes:
      - data:/data
      # Agent logs, read-only. Compose has no optional bind mounts: a missing folder is created
      # empty, so startup never fails. `make up` creates both as your user first, because the
      # Docker engine on Linux would otherwise create them owned by root.
      - type: bind
        source: ${HOME}/.claude/projects
        target: /sources/claude/projects
        read_only: true
      - type: bind
        source: ${HOME}/.codex/sessions
        target: /sources/codex/sessions
        read_only: true
      # No Claude login is mounted. The CLI judge signs in on its own (`make claude-login`) and keeps
      # that login in /data/claude-home, a private home no source reads. Your ~/.claude stays
      # untouched, so the container can never rotate or invalidate your own login.
      # TRUSTED, WRITABLE. Anything that can write to these folders can change what Introspect reads
      # and commits, and a hook in a project's .git/hooks runs when Introspect runs git there; git
      # hooks cannot be switched off for a mount generically. Mount only repositories you own.
      # Global skills repository and project repositories, read-write: Introspect commits
      # rubrics and merges proposals there. `make up` creates both folders as your user first.
      # The default is a dedicated folder, never ~/.claude: that holds your Claude credentials,
      # hooks and transcripts, and a read-write mount would defeat the read-only /sources mounts.
      # Set INTROSPECT_SKILLS_REPO to your existing skills repository, or leave it and let the
      # setup wizard create a repository in the empty default folder.
      - type: bind
        source: ${INTROSPECT_SKILLS_REPO:-${HOME}/.introspect/skills}
        target: /repos/skills
      - type: bind
        source: ${INTROSPECT_PROJECTS_DIR:-${HOME}/.introspect/projects}
        target: /repos/projects

volumes:
  data:
